modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
description = '''
Quality-of-life improvements for the Create Stock Keeper request screen (also in Create: Remote Terminal).
Works on the client alone; installed on the server too (or in single player) it also shows what is inside
each container and every gauge of the network.
'''
authors = "Stock Keeper Plus contributors"
# Optional on both sides: clients and servers without it can still connect.
displayTest = "IGNORE_ALL_VERSION"

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.219,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1]"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "create"
type = "required"
versionRange = "[6.0.10,6.1)"
ordering = "AFTER"
side = "BOTH"
